# Portal Worker deployed by the existing Cloudflare project "xentool".
# CF build settings: Root "/" + Deploy command "npx wrangler deploy".
# Keep this file at the repository root and keep main = src/index.js.
# Custom Domains are exact-match only — wildcard hostnames are not supported.

name = "xentool"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Custom Domains — declared here for the same reason as KV: this file is the
# source of truth, so dashboard-only domains get dropped on the next deploy.
#   tool.xen.autos → portal + tools under path prefixes
#   xen.autos      → the same; the apex root is intentionally NOT a short-code
#                    namespace, so it stays free for future use
# Keep every top-level key ABOVE the first [table] header, or TOML nests it.
routes = [
  { pattern = "tool.xen.autos", custom_domain = true },
  { pattern = "xen.autos", custom_domain = true },
]

[observability]
enabled = true

# Secrets are NOT declared here — this file is committed.
# Admin surfaces (short links, KV console, SQL console, AI, file upload) expect:
#   npx wrangler secret put ADMIN
# For `wrangler dev`, put ADMIN in .dev.vars (gitignored).
# Rotating the secret invalidates every existing admin session cookie.

# ---------------------------------------------------------------------------
# Bindings that need NO pre-created resource — always safe to deploy.
# ---------------------------------------------------------------------------

# Durable storage. Must be declared here: Wrangler treats this file as the
# source of truth and drops dashboard-only bindings on the next deploy.
# Namespace "tool".
[[kv_namespaces]]
binding = "KV"
id = "986df2ee8df44ffe8256254272eb4fef"

# Workers AI. No provisioning step: the binding is enough.
[ai]
binding = "AI"

# Durable Objects. Migration tag "v1" creates both classes on first deploy.
# SQLite-backed storage is required on the free plan.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter", "Room"]

# Cron: sweep expired R2 objects. Safe with no R2 binding — the handler no-ops.
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# Bindings that REQUIRE a pre-created resource.
#
# Do NOT uncomment these with a placeholder id. Wrangler validates them at
# deploy time, so a fake database_id or a missing bucket turns the next
# Workers Builds run red — which also stops the auto-deploy the team relies on.
# Create the resource first, then paste the real identifier.
# ---------------------------------------------------------------------------

# R2 — file share tool (/file). Bucket already provisioned as `xbt`.
# Uploads are hard-stopped at 60% of the free 10 GB allowance (quota.js), so
# this cannot silently turn into a bill.
[[r2_buckets]]
binding = "R2"
bucket_name = "xbt"

# D1 — SQL console (/sql). The database `xdb` already exists; the only missing
# piece is its UUID, which is account-specific and cannot be guessed. A fake id
# fails `wrangler deploy` outright, which is why this stays commented:
#   npx wrangler d1 list                      # prints the uuid for xdb
#   npx wrangler d1 execute xdb --remote --file=./schema.sql
# Then uncomment and paste the uuid:
# [[d1_databases]]
# binding = "DB"
# database_name = "xdb"
# database_id = "<uuid of xdb>"

# Queues — background expiry sweep. Optional: the cron trigger already does it.
#   npx wrangler queues create xentool-tasks
# [[queues.producers]]
# binding = "TASKS"
# queue = "xentool-tasks"
#
# [[queues.consumers]]
# queue = "xentool-tasks"
# max_batch_size = 10
# max_retries = 3

# Vectorize — semantic search (/vector, still planned in the catalog).
#   npx wrangler vectorize create xentool-index --dimensions=1024 --metric=cosine
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "xentool-index"

# Optional runtime catalog override (static src/catalog.js remains the fallback):
# [[kv_namespaces]]
# binding = "CATALOG_KV"
# id = "<namespace id>"
