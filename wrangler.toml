# Portal Worker deployed by the existing Cloudflare project "xentool".
# CF build settings: Root "/" + Deploy command "npx wrangler deploy".
# Keep this file at the repository root and keep main = src/index.js.
# tool.xen.autos is already bound as a Custom Domain in the CF dashboard.
# Custom Domains are exact-match only — wildcard hostnames are not supported.

name = "xentool"
main = "src/index.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# The KV binding `KV` (namespace "tool") is configured in the CF dashboard and
# is intentionally NOT declared here, so no namespace id needs to be committed.
# Verify after deploy: GET /paste/ should report storage="kv", durable=true.
# If it reports "memory", the deploy replaced the dashboard binding; then add:
# [[kv_namespaces]]
# binding = "KV"
# id = "<namespace id>"
#
# Optional runtime catalog override (static src/catalog.js remains the fallback):
# [[kv_namespaces]]
# binding = "CATALOG_KV"
# id = "<namespace id>"
